name: Prueba programada

# Manda un mensaje de prueba a Telegram para confirmar que todo funciona con
# el PC apagado. El cron lleva dia y mes fijos (31 de agosto), asi que dispara
# solo hoy y no vuelve a molestar.
#
# Dos intentos: 16:30 y 16:40 UTC = 12:30 y 12:40 en Chile.
#
# OJO con el margen: GitHub tarda en registrar el cron de un repo recien creado
# y su scheduler es "best effort" (5-20 min de atraso es normal, y bajo carga se
# salta ticks). El primer intento fallido se programo 7 minutos despues del push
# y nunca disparo. Estos horarios tienen un margen parecido, asi que si no llega
# nada es lo mismo de antes: el scheduler todavia no arranca en este repo.
#
# Cuando te llegue el mensaje, este archivo ya cumplio: puedes borrarlo.
# El watcher de verdad es traderie.yml, que corre cada 5 minutos.

on:
  schedule:
    - cron: "30,40 16 31 8 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # --test no toca la API de Traderie: solo prueba la entrega al celular.
      - run: python traderie-notifications.py --test
        env:
          TRADERIE_AUTH: ${{ secrets.TRADERIE_AUTH }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_CHANNELS: telegram
