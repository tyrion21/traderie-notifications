name: Traderie watcher

on:
  schedule:
    # Cada 5 min es el mínimo que acepta GitHub. En la práctica se atrasa
    # bastante en horas peak: cuenta con 5-15 min de latencia real.
    - cron: "*/5 * * * *"
  workflow_dispatch: # para dispararlo a mano desde la pestaña Actions

# Sin esto no puede escribir la caché en algunos repos.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # El estado vive en la caché: cada corrida guarda una clave nueva y
      # restaura la más reciente. Si se pierde, COLD_START_HOURS evita
      # quedarse sin avisos (y evita spamear el historial).
      - uses: actions/cache@v4
        with:
          path: seen_offers.json
          key: traderie-state-${{ github.run_id }}
          restore-keys: |
            traderie-state-

      - run: python traderie-notifications.py --once
        env:
          TRADERIE_AUTH: ${{ secrets.TRADERIE_AUTH }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_CHANNELS: telegram
          WATCH_EVENTS: accepted
          # Margen > intervalo del cron, por si se pierde la caché.
          COLD_START_HOURS: "2"
