name: Watcher continuo

# Corre dos vigilantes en paralelo dentro del mismo job:
#   - traderie-notifications.py -> ofertas aceptadas/entrantes en Traderie
#   - terror-zones.py           -> Terror Zones de D2R que te interesan
#
# Alternativa al cron de GitHub, que en esta repo nunca arrancó: cero corridas
# programadas en su primera hora de vida, teniendo un */5 configurado. En vez
# de depender del scheduler, esto corre UN job largo que hace polling cada 60s
# durante 5h45m y deja su relevo reservado en la cola desde el arranque.
#
# Bootstrap: dispáralo UNA vez a mano desde la pestaña Actions. De ahí en
# adelante se sostiene solo y no vuelve a tocar el scheduler.
#
# Requiere el secret RELAUNCH_TOKEN: un PAT fine-grained sobre esta repo con
# permiso "Actions: Read and write". El GITHUB_TOKEN por defecto NO sirve:
# GitHub ignora los workflow_dispatch hechos con él, justamente para evitar
# recursiones como esta.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Si un relanzamiento se solapa con el job saliente, que no queden dos
  # watchers mandando la misma notificación duplicada.
  group: watcher-continuo
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # el techo de GitHub son 6h
    steps:
      # El relevo se reserva AL PRINCIPIO, no al final, y esto es lo que
      # sostiene la cadena. El run nuevo se dispara ya, se queda esperando por
      # el `concurrency` de arriba y arranca cuando este job muera, sea como
      # sea: timeout, fallo, cancelación o runner reclamado por GitHub
      # ("The hosted runner lost communication with the server"). Ese último
      # caso es el que rompía la cadena cuando el relanzamiento vivía en el
      # último paso: el runner se va sin llegar a ejecutarlo y nadie relanza,
      # así que las notificaciones se apagan en silencio. Pasó el 2026-09-24:
      # el job murió a las 4h09m y el watcher quedó muerto.
      #
      # Va antes del checkout para que la reserva exista incluso si el setup
      # falla; por eso necesita GH_REPO, que sin repo clonado `gh` no adivina
      # sobre qué repo trabaja.
      - name: Reservar relevo
        run: |
          gh workflow run watcher-continuo.yml --ref main
          echo "Relevo en cola; arranca solo cuando este job termine."
        env:
          GH_TOKEN: ${{ secrets.RELAUNCH_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Mismo esquema que traderie.yml: el estado viaja por la caché entre
      # relanzamientos. Como el hueco entre uno y otro es de segundos,
      # COLD_START_HOURS=2 tapa cualquier pérdida sin spamear el historial.
      - uses: actions/cache@v4
        with:
          path: |
            seen_offers.json
            seen_tz.json
          key: traderie-state-${{ github.run_id }}
          restore-keys: |
            traderie-state-

      # `timeout` mata el proceso a las 5h45m, 5 minutos antes del
      # timeout-minutes del job. Ese margen ya no es crítico para la cadena
      # (el relevo está reservado desde el primer paso), pero deja que la caché
      # se guarde en su post-step en vez de morir con el job cancelado.
      # El `|| true` evita que el kill marque fallo.
      - name: Vigilar
        id: watch
        run: |
          echo "inicio=$(date +%s)" >> "$GITHUB_OUTPUT"
          # Los dos watchers corren en paralelo en el mismo job: ofertas de
          # Traderie y Terror Zones. Cada uno con su propio timeout, y el
          # `|| true` final evita que el kill marque el job como fallido y se
          # salte el relanzamiento.
          timeout 20700 python traderie-notifications.py &
          ofertas=$!
          timeout 20700 python terror-zones.py &
          tzones=$!
          wait $ofertas $tzones || true
        env:
          TRADERIE_AUTH: ${{ secrets.TRADERIE_AUTH }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_CHANNELS: telegram
          WATCH_EVENTS: accepted,incoming
          POLL_SECONDS: "60"
          # El hueco entre un relanzamiento y el siguiente es de segundos, no
          # de minutos, asi que no hace falta la ventana de 2h que pedia el
          # cron viejo. Ademas acota el daño: la cache se guarda en el
          # post-step, o sea DESPUES de relanzar, y si el job nuevo alcanzara
          # a restaurar estado viejo reenviaria como maximo 15 min de
          # historial en vez de 2 horas.
          COLD_START_HOURS: "0.25"
          # Las Terror Zones rotan cada media hora, asi que los 120s por
          # defecto se comen hasta un 7% de la ventana antes de avisar. A 60s
          # el aviso de "ya esta activa" llega mas pegado a la rotacion.
          TZ_POLL_SECONDS: "60"
          # Las zonas vigiladas viven en TZ_WATCH_DEFAULT, dentro de
          # terror-zones.py. Para cambiarlas edita esa lista (o define TZ_WATCH
          # aca si prefieres tenerlas a la vista en el workflow).

      # Contrapeso de la reserva. Si la vigilancia duró menos de 5 minutos algo
      # está roto de verdad (token vencido, dependencias, API caída) y el relevo
      # ya en cola convertiría la cadena en un crash loop caliente quemando
      # corridas. En ese caso lo cancelamos y fallamos ruidosamente.
      # INICIO vacío = el paso de vigilancia no llegó ni a arrancar, que también
      # cuenta como roto.
      - name: Abortar relevo si algo se rompió
        if: always()
        env:
          GH_TOKEN: ${{ secrets.RELAUNCH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INICIO: ${{ steps.watch.outputs.inicio }}
        run: |
          if [ -n "$INICIO" ]; then
            vivio=$(( $(date +%s) - INICIO ))
          else
            vivio=0
          fi
          if [ "$vivio" -ge 300 ]; then
            echo "Vigilancia de ${vivio}s. El relevo en cola sigue su curso."
            exit 0
          fi
          echo "El watcher solo duró ${vivio}s. Cancelo el relevo para no entrar en crash loop." >&2
          for id in $(gh run list --workflow watcher-continuo.yml --limit 20 \
                        --json databaseId,status \
                        --jq '.[] | select(.status == "queued" or .status == "pending" or .status == "waiting") | .databaseId'); do
            if [ "$id" != "$GITHUB_RUN_ID" ]; then
              gh run cancel "$id" && echo "Relevo $id cancelado." || echo "No pude cancelar $id." >&2
            fi
          done
          exit 1
